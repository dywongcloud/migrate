minimumLimaVersion: "1.0.0"
vmType: vz
arch: aarch64
nestedVirtualization: true

cpus: 6
memory: 8GiB
disk: 100GiB

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

mounts:
  - location: "~/daedal"
    writable: true
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential flex bison libssl-dev libelf-dev bc dwarves \
        gcc-x86-64-linux-gnu musl-tools git curl jq acl e2fsprogs \
        libncurses-dev fakeroot rsync kmod cpio zstd
